[project]
name = "koja"
version = "0.0.2"
description = "SDK for koja.sh: on-demand infrastructure for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Saefstroem", email = "alexandersafstrom@proton.me" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]
keywords = ["sandbox", "microvm", "agents", "ai", "vm", "koja"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://koja.sh"
Documentation = "https://koja.sh/docs"
Repository = "https://github.com/koja-sh/koja-py"
Issues = "https://github.com/koja-sh/koja-py/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"